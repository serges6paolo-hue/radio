name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          ls -la $ANDROID_HOME/platforms/ || ls -la $ANDROID_HOME/cmdline-tools/latest/bin/../..

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Debug files
        run: |
          ls -la
          cat capacitor.config.json
          cat package.json | head -20

      - name: Sync Capacitor
        run: |
          npx cap doctor || true
          chmod +x android/gradlew || true
          npx cap copy android --verbose || npx cap copy android
          npx cap update android --verbose || echo "update skipped"

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee gradle-debug.log
          echo "=== GRADLE LOG TAIL ==="
          tail -100 gradle-debug.log || true
          echo "=== APK EXISTS CHECK ==="
          ls -lh app/build/outputs/apk/debug/ || ls -R app/build/outputs/ || echo "no apk dir"

      - name: Summarize Gradle Failure
        if: failure()
        run: |
          echo "## Gradle Debug Log (tail 300)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -300 android/gradle-debug.log >> $GITHUB_STEP_SUMMARY 2>&1 || cat android/gradle-debug.log >> $GITHUB_STEP_SUMMARY 2>&1 || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## LS outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -R android/app/build/outputs/ >> $GITHUB_STEP_SUMMARY 2>&1 || echo "no outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Gradle Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: android/gradle-debug.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radio-global-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Build APK (release unsigned)
        working-directory: android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-release.log || echo "release build failed - debug apk still valid"
          ls -lh app/build/outputs/apk/release/ || echo "no release apk"

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radio-global-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
